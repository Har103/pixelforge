<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>{{ROOM_NAME}} — Pixelforge</title>
<meta name="description" content="{{ROOM_DESC}}">
<meta property="og:title" content="{{ROOM_NAME}}">
<meta property="og:description" content="{{ROOM_DESC}}">
<meta property="og:type" content="website">
<meta property="og:url" content="{{OG_URL}}">
<meta property="og:image" content="{{OG_IMAGE}}">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="{{OG_IMAGE}}">
<link rel="stylesheet" href="/assets/style.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%2312141c'/%3E%3Crect x='2' y='2' width='5' height='5' fill='%23ff4d6d'/%3E%3Crect x='9' y='2' width='5' height='5' fill='%23ffd60a'/%3E%3Crect x='2' y='9' width='5' height='5' fill='%233a86ff'/%3E%3Crect x='9' y='9' width='5' height='5' fill='%238ac926'/%3E%3C/svg%3E">
</head>
<body data-slug="{{ROOM_SLUG}}">

<div id="boot" class="boot">
  <div class="boot-inner">
    <div class="boot-grid" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
    <p id="bootMsg">Loading the canvas…</p>
  </div>
</div>

<header class="topbar">
  <a class="brand" href="/" title="All canvases">
    <span class="brand-mark" aria-hidden="true"></span>
  </a>
  <div class="room-title">
    <h1 id="roomName">{{ROOM_NAME}}</h1>
    <p class="room-sub" id="roomSub"></p>
  </div>

  <div class="topbar-stats">
    <div class="stat"><span class="stat-value" id="statClients">–</span><span class="stat-label">online</span></div>
    <div class="stat"><span class="stat-value" id="statPainted">–</span><span class="stat-label">painted</span></div>
    <div class="stat"><span class="stat-value" id="statPlacements">–</span><span class="stat-label">placements</span></div>
  </div>

  <div class="topbar-right">
    <span id="pausedBadge" class="badge badge-warn" hidden>paused</span>
    <div class="conn" id="conn" title="Realtime transport">
      <span class="conn-dot" id="connDot"></span>
      <span class="conn-label" id="connLabel">connecting</span>
    </div>
    <button class="ghost" id="btnShare">share</button>
    <button class="ghost" id="btnOwner" hidden title="Moderator tools">manage</button>
    <button class="ghost" id="btnTransport" title="Switch between WebSocket and Server-Sent Events">ws</button>
    <button class="ghost sq" id="btnHelp" title="Keyboard shortcuts and help" aria-label="Help">?</button>
  </div>
</header>

<main class="stage" id="stage">
  <canvas id="board" aria-label="Shared pixel canvas"></canvas>

  <!-- The template panel is a reference image quantised to the room's palette
       and drawn under the canvas as a guide. The image is read in the browser
       and never uploaded: a picture you are only using to line up your own
       pixels is nobody else's business, least of all the server's. -->
  <aside class="panel panel-tpl" id="tplPanel" hidden aria-label="Template overlay">
    <div class="panel-head">
      <span>template</span>
      <button class="ghost sq" id="btnTplClose" aria-label="Close template panel">×</button>
    </div>

    <div class="panel-body">
      <label class="dropzone" id="tplDrop" tabindex="0">
        <input type="file" id="tplFile" accept="image/*" hidden>
        <span class="dropzone-title">drop an image</span>
        <span class="dropzone-sub">or click to choose · never leaves this browser</span>
      </label>

      <div id="tplLoaded" hidden>
        <div class="row">
          <span class="row-label">dither</span>
          <select id="tplMode" class="ghost sel-input"></select>
        </div>
        <label class="row check">
          <input type="checkbox" id="tplAvoidBg">
          <span>keep off the background colour</span>
        </label>

        <div class="tpl-progress">
          <div class="tpl-progress-top">
            <span id="tplSize" class="mono">–</span>
            <span id="tplPercent" class="mono">0%</span>
          </div>
          <div class="bar"><i id="tplBar" style="width:0%"></i></div>
          <p class="tpl-count" id="tplCount">0 of 0 cells match</p>
        </div>

        <div class="row btns">
          <button class="ghost sm" id="btnTplMove" title="Then drag on the canvas">position</button>
          <button class="ghost sm" id="btnTplNext" title="Jump to the next cell that does not match, and pick its colour">next cell</button>
        </div>
        <div class="row btns">
          <button class="ghost sm" id="btnTplToggle">hide</button>
          <button class="ghost sm" id="btnTplClear">remove</button>
        </div>
      </div>

      <p class="panel-err" id="tplErr" hidden></p>
    </div>
  </aside>

  <canvas id="minimap" class="minimap" width="128" height="128"
          title="Click to jump there" aria-label="Canvas overview" hidden></canvas>

  <div class="hud-left">
    <div class="coords" id="coords">–, –</div>
    <div class="zoombox">
      <button class="ghost sq" id="btnZoomOut" aria-label="Zoom out">−</button>
      <span id="zoomLabel">1×</span>
      <button class="ghost sq" id="btnZoomIn" aria-label="Zoom in">+</button>
      <button class="ghost sq" id="btnFit" title="Fit canvas to screen" aria-label="Fit">⤢</button>
    </div>
  </div>

  <!-- The feed and the cell inspector share the right-hand column so the
       inspector opens directly under the feed instead of floating at whatever
       height the feed happened to grow to. -->
  <div class="hud-right">
    <aside class="feed" id="feed" aria-live="polite" aria-label="Live activity">
      <div class="feed-head">live</div>
      <ul id="feedList"></ul>
      <p class="feed-empty" id="feedEmpty">waiting for the next pixel</p>
    </aside>

    <!-- Provenance. A canvas where nobody can ask "who painted this, and what
         was here before" is a grid; being able to ask is what makes it a
         place. -->
    <aside class="panel panel-inspect" id="inspectPanel" hidden aria-label="Cell history">
      <div class="panel-head">
        <span id="inspectTitle">cell</span>
        <button class="ghost sq" id="btnInspectClose" aria-label="Close cell history">×</button>
      </div>
      <div class="panel-body" id="inspectBody"></div>
    </aside>
  </div>

  <div class="timelapse" id="timelapse" hidden>
    <button class="ghost sq" id="btnPlay" aria-label="Play or pause">▶</button>
    <input type="range" id="scrub" min="0" max="0" value="0" aria-label="Scrub through canvas history">
    <span class="timelapse-label" id="timelapseLabel">0 / 0</span>
    <a class="ghost sm" id="btnGif" href="#" download>save gif</a>
    <button class="ghost" id="btnExitLapse">exit</button>
  </div>
</main>

<footer class="dock">
  <div class="cooldown" id="cooldown">
    <svg viewBox="0 0 40 40" aria-hidden="true">
      <circle class="cd-track" cx="20" cy="20" r="16"></circle>
      <circle class="cd-fill" id="cdFill" cx="20" cy="20" r="16"></circle>
    </svg>
    <span id="cooldownText">ready</span>
  </div>

  <div class="palette" id="palette" role="radiogroup" aria-label="Colour palette"></div>

  <div class="dock-actions">
    <button class="ghost" id="btnUndo" title="Take back your last pixel (Ctrl/⌘+Z)">undo</button>
    <button class="ghost" id="btnTemplate" title="Trace over a reference image">template</button>
    <button class="ghost" id="btnLapse" title="Replay how the canvas was built">time-lapse</button>
    <button class="ghost" id="btnStats" title="Canvas statistics">stats</button>
  </div>
</footer>

<div class="sheet" id="sheet" hidden>
  <div class="sheet-inner">
    <button class="sheet-close ghost sq" id="btnSheetClose" aria-label="Close">×</button>
    <div id="sheetBody"></div>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="/assets/template.js"></script>
<script src="/assets/app.js"></script>
</body>
</html>
